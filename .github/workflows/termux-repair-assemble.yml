name: Assemble verified Termux repair

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repair branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: adybag14-cyber/hermes-agent
          ref: fix/termux-native-install-chain
          fetch-depth: 0

      - name: Apply, test, squash, and push
        shell: bash
        run: bash .termux-repair/repair.sh
