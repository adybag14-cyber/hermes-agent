name: Assemble verified Termux repair

on:
  push:
    branches:
      - codex/termux-five-goals
    paths:
      - .github/workflows/termux-repair-assemble.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repair branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: adybag14-cyber/hermes-agent
          ref: fix/termux-native-install-chain
          fetch-depth: 0

      - name: Restore installer and apply minimal native-Termux dispatch
        shell: bash
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/NousResearch/hermes-agent.git 2>/dev/null || \
            git remote set-url upstream https://github.com/NousResearch/hermes-agent.git
          git fetch upstream main
          git show upstream/main:scripts/install.sh > /tmp/install-upstream.sh

          python - <<'PY'
          from pathlib import Path

          source = Path('/tmp/install-upstream.sh').read_text(encoding='utf-8')
          marker = 'set -e\n'
          assert source.count(marker) == 1, 'unexpected upstream install.sh set -e layout'
          dispatch = r'''

          # Native Termux uses a dedicated uv-based installer. Keep the established
          # Linux/macOS installer below in this file: bootstrap integrations and
          # regression tests intentionally inspect its functions in place.
          if [ -n "${TERMUX_VERSION:-}" ] || [[ "${PREFIX:-}" == *"com.termux/files/usr"* ]]; then
              _hermes_script_dir=""
              _hermes_source="${BASH_SOURCE[0]:-}"
              if [ -n "$_hermes_source" ] && [ -f "$_hermes_source" ]; then
                  _hermes_script_dir="$(cd "$(dirname "$_hermes_source")" 2>/dev/null && pwd || true)"
              fi

              if [ -n "$_hermes_script_dir" ] && [ -f "$_hermes_script_dir/install-termux.sh" ]; then
                  exec bash "$_hermes_script_dir/install-termux.sh" "$@"
              fi

              _hermes_install_ref="${HERMES_INSTALL_REF:-main}"
              _hermes_previous=""
              for _hermes_arg in "$@"; do
                  if [ "$_hermes_previous" = "--branch" ] || [ "$_hermes_previous" = "-Branch" ] || \
                     [ "$_hermes_previous" = "--commit" ] || [ "$_hermes_previous" = "-Commit" ]; then
                      _hermes_install_ref="$_hermes_arg"
                      _hermes_previous=""
                      continue
                  fi
                  case "$_hermes_arg" in
                      --branch|-Branch|--commit|-Commit) _hermes_previous="$_hermes_arg" ;;
                  esac
              done

              if ! command -v curl >/dev/null 2>&1; then
                  echo "Hermes native Termux installer requires curl" >&2
                  exit 1
              fi

              _hermes_base="${HERMES_INSTALL_SCRIPT_BASE_URL:-https://raw.githubusercontent.com/NousResearch/hermes-agent/${_hermes_install_ref}/scripts}"
              _hermes_tmp="$(mktemp 2>/dev/null || printf '%s/hermes-install-termux.%s.sh' "${TMPDIR:-/tmp}" "$$")"
              if ! curl -fsSL "$_hermes_base/install-termux.sh" -o "$_hermes_tmp"; then
                  echo "Failed to download the native Termux installer: $_hermes_base/install-termux.sh" >&2
                  rm -f "$_hermes_tmp"
                  exit 1
              fi

              if bash "$_hermes_tmp" "$@"; then
                  _hermes_rc=0
              else
                  _hermes_rc=$?
              fi
              rm -f "$_hermes_tmp"
              exit "$_hermes_rc"
          fi
          '''
          patched = source.replace(marker, marker + dispatch, 1)
          Path('scripts/install.sh').write_text(patched, encoding='utf-8')
          PY

          rm -f scripts/install-legacy.sh
          chmod 755 scripts/install.sh scripts/install-termux.sh
          bash -n scripts/install.sh scripts/install-termux.sh

      - name: Replace router regression with contract-preservation coverage
        shell: bash
        run: |
          cat > tests/test_install_termux_native.py <<'PY'
          from __future__ import annotations

          import os
          import shutil
          import subprocess
          from pathlib import Path

          REPO_ROOT = Path(__file__).resolve().parent.parent
          INSTALL = REPO_ROOT / "scripts" / "install-termux.sh"
          INSTALL_SH = REPO_ROOT / "scripts" / "install.sh"


          def test_termux_installer_is_uv_only_and_serializes_native_builds() -> None:
              text = INSTALL.read_text(encoding="utf-8")
              assert "uv venv --python" in text
              assert "uv pip install --python" in text
              assert "python -m pip" not in text
              assert "UV_LINK_MODE=copy" in text
              assert "UV_CONCURRENT_BUILDS=1" in text
              assert "CARGO_BUILD_JOBS=1" in text
              assert "UV_DEFAULT_INDEX" in text
              assert "unset UV_INDEX UV_EXTRA_INDEX_URL PIP_INDEX_URL PIP_EXTRA_INDEX_URL" in text


          def test_termux_installer_rejects_python_314_and_preserves_system_aliases() -> None:
              text = INSTALL.read_text(encoding="utf-8")
              assert "(3, 11) <= sys.version_info < (3, 14)" in text
              assert "apt download python3.11" in text
              assert '"$staged_prefix/bin/python"' in text
              assert '"$staged_prefix/bin/python3"' in text
              assert 'cp -a "$staged_prefix/." "$PREFIX/"' in text


          def test_termux_installer_has_launcher_recovery_and_version_smoke() -> None:
              text = INSTALL.read_text(encoding="utf-8")
              assert "venv.pre-native-termux" in text
              assert "unset PYTHONPATH" in text
              assert 'exec "$venv_hermes"' in text
              assert "--version|-V|version)" in text
              assert '"$PREFIX/bin/hermes" --version' in text
              assert "uv pip check --python" in text


          def test_dispatch_keeps_established_installer_contracts_in_place() -> None:
              text = INSTALL_SH.read_text(encoding="utf-8")
              dispatch = "# Native Termux uses a dedicated uv-based installer."
              assert dispatch in text
              assert text.index(dispatch) < text.index("# Parse arguments")
              for signature in (
                  "resolve_install_layout() {",
                  "install_system_packages() {",
                  "setup_path() {",
                  "run_setup_wizard() {",
                  "maybe_start_gateway() {",
              ):
                  assert signature in text
              assert not (INSTALL_SH.parent / "install-legacy.sh").exists()


          def test_termux_dispatches_to_local_installer_without_network(tmp_path: Path) -> None:
              scripts = tmp_path / "scripts"
              scripts.mkdir()
              shutil.copy2(INSTALL_SH, scripts / "install.sh")
              child = scripts / "install-termux.sh"
              child.write_text("#!/bin/bash\nprintf 'termux:%s\\n' \"$*\"\n", encoding="utf-8")
              child.chmod(0o755)

              env = os.environ.copy()
              env.update({"TERMUX_VERSION": "0.118", "PREFIX": "/data/data/com.termux/files/usr"})
              result = subprocess.run(
                  ["bash", str(scripts / "install.sh"), "--skip-setup"],
                  env=env,
                  capture_output=True,
                  text=True,
                  check=True,
              )
              assert result.stdout.strip() == "termux:--skip-setup"


          def test_streamed_termux_dispatch_honors_requested_ref(tmp_path: Path) -> None:
              scripts = tmp_path / "scripts"
              scripts.mkdir()
              shutil.copy2(INSTALL_SH, scripts / "install.sh")

              stub = tmp_path / "install-termux.stub.sh"
              stub.write_text("#!/bin/bash\nprintf 'remote:%s\\n' \"$*\"\n", encoding="utf-8")
              stub.chmod(0o755)

              fake_bin = tmp_path / "bin"
              fake_bin.mkdir()
              fake_curl = fake_bin / "curl"
              fake_curl.write_text(
                  "#!/bin/bash\n"
                  "url=''\nout=''\n"
                  "while [ \"$#\" -gt 0 ]; do\n"
                  "  case \"$1\" in\n"
                  "    -o) out=\"$2\"; shift 2 ;;\n"
                  "    -*) shift ;;\n"
                  "    *) url=\"$1\"; shift ;;\n"
                  "  esac\n"
                  "done\n"
                  "printf '%s\\n' \"$url\" > \"$CURL_LOG\"\n"
                  "cp \"$TERMUX_STUB_SOURCE\" \"$out\"\n",
                  encoding="utf-8",
              )
              fake_curl.chmod(0o755)

              env = os.environ.copy()
              env.update(
                  {
                      "TERMUX_VERSION": "0.118",
                      "PREFIX": "/data/data/com.termux/files/usr",
                      "PATH": f"{fake_bin}:{env['PATH']}",
                      "TERMUX_STUB_SOURCE": str(stub),
                      "CURL_LOG": str(tmp_path / "curl.log"),
                  }
              )
              result = subprocess.run(
                  [
                      "bash",
                      str(scripts / "install.sh"),
                      "--branch",
                      "feature/native",
                      "--skip-setup",
                  ],
                  env=env,
                  capture_output=True,
                  text=True,
                  check=True,
              )
              assert result.stdout.strip() == "remote:--branch feature/native --skip-setup"
              assert (tmp_path / "curl.log").read_text(encoding="utf-8").strip().endswith(
                  "/feature/native/scripts/install-termux.sh"
              )
          PY

      - name: Run all installer contract regressions
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -q pytest
          python -m pytest -q \
            tests/test_install_sh_root_fhs_uv_python_path.py \
            tests/test_install_sh_symlink_stomp.py \
            tests/test_install_sh_setup_wizard_tty_probe.py \
            tests/test_install_sh_browser_install.py \
            tests/test_install_sh_node_global_prefix.py \
            tests/test_install_sh_install_method_stamp.py \
            tests/test_install_sh_termux_network_prereqs.py \
            tests/test_install_sh_pythonpath_sanitization.py \
            tests/test_install_lockfile_churn.py \
            tests/test_install_autostash_conflict_recovery.py \
            tests/test_install_no_initial_commit.py \
            tests/test_install_unmerged_index.py \
            tests/test_install_diverged_update.py \
            tests/test_install_termux_native.py

      - name: Squash onto current upstream main and push verified tree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .termux-repair
          rm -f .github/workflows/termux-repair-assemble.yml
          git config user.name adybag14-cyber
          git config user.email adybag14@gmail.com
          git add -A
          git reset --soft upstream/main
          git add -A
          git commit -m "fix(termux): repair the complete native install chain"
          git push --force origin HEAD:fix/termux-native-install-chain
