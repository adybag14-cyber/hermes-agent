name: Assemble verified Termux repair

on:
  pull_request:
    branches:
      - codex/termux-five-goals
    types:
      - opened
      - synchronize

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.head.ref == 'fix/termux-native-install-chain' && hashFiles('.termux-repair/repair.sh') != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repair branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: adybag14-cyber/hermes-agent
          ref: fix/termux-native-install-chain
          fetch-depth: 0

      - name: Apply, test, squash, and push
        shell: bash
        run: bash .termux-repair/repair.sh
