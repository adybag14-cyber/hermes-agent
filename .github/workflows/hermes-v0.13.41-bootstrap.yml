name: Hermes 0.13.41 Bootstrap

on:
  push:
    branches:
      - codex/v0.13.41-bootstrap
  workflow_dispatch:

concurrency:
  group: hermes-v0.13.41-bootstrap
  cancel-in-progress: false

jobs:
  apply-build-release:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    permissions:
      contents: write

    env:
      TARGET_BRANCH: feat/termux-install-path
      BOOTSTRAP_BRANCH: codex/v0.13.41-bootstrap
      EXPECTED_BASE: 539d06f0d0e4e8264a9e9459525130caed1edaf1
      PATCH_SHA256: abb18a1442a2f1ee6bf36a27677961197a556075417610753250e236087bcd95
      HERMES_RELEASE_TAG: v0.13.41

    steps:
      - name: Checkout target branch
        uses: actions/checkout@v5
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Decode verified patch
        run: |
          git fetch origin "$BOOTSTRAP_BRANCH" --depth=1
          git show "origin/$BOOTSTRAP_BRANCH:.github/hermes-v0.13.41.patch.gz.b64" \
            | tr -d '[:space:]' \
            | base64 -d \
            | gzip -d > /tmp/hermes-v0.13.41.patch
          echo "$PATCH_SHA256  /tmp/hermes-v0.13.41.patch" | sha256sum -c -

      - name: Apply patch to target branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          current_head="$(git rev-parse HEAD)"
          if [ "$current_head" = "$EXPECTED_BASE" ]; then
            git apply --index /tmp/hermes-v0.13.41.patch
            git diff --check --cached
            git commit -m "feat(devtools): add Windows emulator visual harness"
          elif [ "$(git log -1 --pretty=%s)" = "feat(devtools): add Windows emulator visual harness" ]; then
            echo "Target branch already contains the Hermes 0.13.41 commit."
          else
            echo "Unexpected target branch HEAD: $current_head" >&2
            echo "Expected $EXPECTED_BASE or the already-applied release commit." >&2
            exit 1
          fi
          commit_sha="$(git rev-parse HEAD)"
          echo "release_commit=$commit_sha" >> "$GITHUB_ENV"
          git push origin "HEAD:$TARGET_BRANCH"
          if git ls-remote --exit-code --tags origin "refs/tags/$HERMES_RELEASE_TAG" >/tmp/hermes-tag.txt 2>/dev/null; then
            remote_tag="$(awk '{print $1}' /tmp/hermes-tag.txt)"
            if [ "$remote_tag" != "$commit_sha" ]; then
              echo "Tag $HERMES_RELEASE_TAG already exists at $remote_tag, not $commit_sha" >&2
              exit 1
            fi
            echo "Tag $HERMES_RELEASE_TAG already points at $commit_sha."
          else
            git tag "$HERMES_RELEASE_TAG"
            git push origin "refs/tags/$HERMES_RELEASE_TAG"
          fi

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Python 3.13 for Chaquopy
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Restore signing material
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/release.keystore
          cat > android/keystore.properties <<EOF
          storeFile=release.keystore
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      - name: Ensure Gradle wrapper is executable
        run: chmod +x android/gradlew

      - name: Build signed Android artifacts
        working-directory: android
        env:
          SOURCE_DATE_EPOCH: "315532800"
        run: |
          rm -rf ../build
          export PYTHON_FOR_BUILD="$(command -v python3.13 || command -v python3 || command -v python)"
          ./gradlew :app:assembleRelease :app:bundleRelease

      - name: Rename artifacts and write checksums
        run: python scripts/android_release_manifest.py --tag "$HERMES_RELEASE_TAG"

      - name: Ensure release exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Hermes Agent ${HERMES_RELEASE_TAG}"
          notes_file="RELEASE_${HERMES_RELEASE_TAG}.md"
          if gh release view "$HERMES_RELEASE_TAG" >/dev/null 2>&1; then
            edit_args=(--title "$title" --target "$release_commit")
            if [ -f "$notes_file" ]; then
              edit_args+=(--notes-file "$notes_file")
            fi
            gh release edit "$HERMES_RELEASE_TAG" "${edit_args[@]}"
          else
            create_args=(--target "$release_commit" --title "$title" --generate-notes)
            if [ -f "$notes_file" ]; then
              create_args=(--target "$release_commit" --title "$title" --notes-file "$notes_file")
            fi
            gh release create "$HERMES_RELEASE_TAG" "${create_args[@]}"
          fi

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$HERMES_RELEASE_TAG" \
            dist/android-release/*.apk \
            dist/android-release/*.aab \
            dist/android-release/*.sha256 \
            --clobber
