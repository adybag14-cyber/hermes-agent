name: Android release trace upload

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag whose measured source manifest is committed on this ref
        required: true
        type: string
      runner_label:
        description: Unique hermes-traces- plus 32 lowercase hex characters for an approved one-job container
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: android-release-traces-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      artifact_name: ${{ steps.source.outputs.artifact_name }}
    steps:
      - name: Validate dispatch inputs
        env:
          TAG: ${{ inputs.tag }}
          RUNNER_LABEL: ${{ inputs.runner_label }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v0\.[0-9]+\.[0-9]+$ ]]
          [[ "$RUNNER_LABEL" =~ ^hermes-traces-[0-9a-f]{32}$ ]]
          test "$GITHUB_REPOSITORY" = adybag14-cyber/hermes-agent
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify measured trace source
        id: source
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          digest="$(python scripts/android_release_evidence.py source-identity --require-clean | sed -n 's/^sourceDigest=//p')"
          python scripts/android_perfetto_release_artifact.py verify-source \
            --tag "$TAG" --expected-source-digest "$digest" > "$RUNNER_TEMP/source.json"
          printf 'artifact_name=%s\n' "$(jq -er .artifact_name "$RUNNER_TEMP/source.json")" >> "$GITHUB_OUTPUT"

  upload:
    needs: preflight
    # Register only an approved isolated --ephemeral runner, with no default
    # labels, for this exact unpredictable one-job label. No host mounts/socket.
    runs-on: ['${{ inputs.runner_label }}']
    timeout-minutes: 45
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - name: Check out only trusted trace tooling and metadata
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/android_perfetto_artifacts.py
            /scripts/android_perfetto_release_artifact.py
            /android/release-evidence/perfetto-artifacts/${{ inputs.tag }}/source.json
            /android/release-evidence/${{ inputs.tag }}/performance/*.json
      - name: Hash the closed trace-only input before upload
        env:
          TAG: ${{ inputs.tag }}
        run: python3 scripts/android_perfetto_release_artifact.py verify-traces --tag "$TAG" --trace-root /trace-input
      - name: Upload measured trace bytes
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ needs.preflight.outputs.artifact_name }}
          path: /trace-input/
          if-no-files-found: error
          retention-days: 90
          compression-level: 6
          overwrite: false

  verify-round-trip:
    needs: [preflight, upload]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Download the immutable artifact on an independent hosted runner
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.upload.outputs.artifact_id }}
          path: ${{ runner.temp }}/perfetto
          merge-multiple: true
          digest-mismatch: error
      - name: Rehash every downloaded trace
        env:
          TAG: ${{ inputs.tag }}
        run: python scripts/android_perfetto_release_artifact.py verify-traces --tag "$TAG" --trace-root "$RUNNER_TEMP/perfetto"
