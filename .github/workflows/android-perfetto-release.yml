name: Android release trace upload
on:
  workflow_dispatch:
    inputs:
      tag:
        required: true
        type: string
      transport_release_id:
        required: true
        type: string
      transport_asset_id:
        required: true
        type: string
      transport_sha256:
        required: true
        type: string
permissions:
  contents: read
jobs:
  hosted-draft-permission-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/android_perfetto_artifacts.py
            /scripts/android_perfetto_release_artifact.py
            /android/release-evidence/perfetto-artifacts/v0.13.159/source.json
            /android/release-evidence/v0.13.159/performance/*.json
      - name: Validate exact private transport access without issuing a release receipt
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ inputs.transport_release_id }}
          ASSET_ID: ${{ inputs.transport_asset_id }}
          ARCHIVE_SHA: ${{ inputs.transport_sha256 }}
        run: |
          set -euo pipefail
          # Only superseded18b measured traces are transport fixtures here.
          # No source qualification, canonical artifact upload or release is performed.
          python scripts/android_perfetto_release_artifact.py download-transport \
            --tag v0.13.159 --transport-release-id "$RELEASE_ID" --transport-asset-id "$ASSET_ID" \
            --transport-sha256 "$ARCHIVE_SHA" --expected-commit "$GITHUB_SHA" --trace-root "$RUNNER_TEMP/verified-input"
          python scripts/android_perfetto_release_artifact.py verify-traces \
            --tag v0.13.159 --trace-root "$RUNNER_TEMP/verified-input"
