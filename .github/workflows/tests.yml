name: Tests

on:
  push:
    branches: [main, codex/termux-five-goals, work/hermes-cognitive-gate]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  pull_request:
    branches: [main, codex/termux-five-goals]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'

  workflow_dispatch:

permissions:
  contents: read

# Cancel in-progress runs for the same PR/branch
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install dependencies
        run: |
          uv venv .venv --python 3.11
          source .venv/bin/activate
          uv pip install -e ".[all,dev]"

      - name: Verify cognitive gate before regression
        run: >-
          scripts/run_tests.sh
          tests/run_agent/test_cognitive_gate_dispatch_integration.py
          tests/test_cognitive_gate.py
          tests/test_tool_plan_validation.py
          tests/run_agent/test_run_agent.py::TestExecuteToolCalls::test_invalid_json_args_is_rejected
          tests/run_agent/test_run_agent.py::TestConcurrentToolExecution::test_malformed_json_args_blocks_entire_batch
          tests/run_agent/test_run_agent.py::TestConcurrentToolExecution::test_non_dict_args_blocks_entire_batch
          odyn_ai/tests/
          -q --tb=short

      - name: Run tests
        run: |
          source .venv/bin/activate
          scripts/run_tests.sh tests/ odyn_ai/tests/ -q --tb=short
        env:
          # Ensure tests don't accidentally call real APIs
          OPENROUTER_API_KEY: ""
          OPENAI_API_KEY: ""
          NOUS_API_KEY: ""

  e2e:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install dependencies
        run: |
          uv venv .venv --python 3.11
          source .venv/bin/activate
          uv pip install -e ".[all,dev]"

      - name: Run e2e tests
        run: |
          source .venv/bin/activate
          python -m pytest tests/e2e/ -v --tb=short
        env:
          OPENROUTER_API_KEY: ""
          OPENAI_API_KEY: ""
          NOUS_API_KEY: ""
