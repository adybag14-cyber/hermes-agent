name: Android

on:
  push:
    branches:
      - feat/termux-install-path
      - codex/termux-five-goals
      - 'codex/android-v*'
      - 'codex/android-chaquopy-*'
  pull_request:
  workflow_dispatch:
    inputs:
      play_registration_snippet:
        description: Optional Android developer verification snippet for a signed package-ownership APK.
        required: false
        type: string

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.play_registration_snippet == '' }}
    runs-on: ${{ fromJSON(vars.HERMES_ANDROID_RUNNER || '["ubuntu-latest"]') }}
    timeout-minutes: 75

    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Python 3.13 for Chaquopy
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          # Skip emulator meta-package; debug assemble/unit tests only need
          # platform-tools, platforms, build-tools, and the locked native toolchain.
          packages: platform-tools platforms;android-35 build-tools;35.0.0 ndk;29.0.14206865 ndk;27.3.13750724 cmake;3.31.6

      - name: Build the genuine Android Python SDK stack from source
        uses: ./.github/actions/prepare-android-python

      - name: Install Python test dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e '.[android,dev]' -c constraints-android.txt

      - name: Run Android-related Python tests
        run: |
          bash scripts/run_tests.sh \
            tests/hermes_android \
            tests/gateway/test_api_server_toolset.py \
            tests/gateway/test_api_server_android_toolset.py \
            tests/tools/test_skills_sync.py \
            tests/tools/test_web_tools_firecrawl_fallback.py \
            tests/run_agent/test_run_agent_chatgpt_web.py \
            -q

      - name: Verify latest LiteRT-LM Android SDK
        run: python scripts/check_android_litertlm_version.py

      - name: Ensure Gradle wrapper is executable
        run: chmod +x android/gradlew

      - name: Build Android debug APK and run unit tests
        working-directory: android
        env:
          SOURCE_DATE_EPOCH: "315532800"
        run: |
          rm -rf ../build
          export PYTHON_FOR_BUILD="$(command -v python3.13 || command -v python3 || command -v python)"
          ./gradlew :app:testDebugUnitTest -PskipHermesAndroidLinuxAssets=true
          ./gradlew :app:compileDebugAndroidTestKotlin -PskipHermesAndroidLinuxAssets=true
          ./gradlew :app:compileBenchmarkKotlin :macrobenchmark:compileBenchmarkKotlin \
            -PskipHermesAndroidLinuxAssets=true
          ./gradlew :app:assembleDebug

      - name: Verify generated runtimes inside the APK
        run: |
          python scripts/verify_android_runtime_package.py android/app/build/outputs/apk/debug/app-debug.apk \
            --python-bundle "${GRADLE_USER_HOME:-$HOME/.gradle}/hermes-python-runtime"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hermes-agent-android-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  signed-play-verification:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.play_registration_snippet != '' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Python 3.13 for Chaquopy
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0

      - name: Restore signing material
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"

      - name: Ensure Gradle wrapper is executable
        run: chmod +x android/gradlew

      - name: Build signed Play verification APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          PLAY_REGISTRATION_SNIPPET: ${{ inputs.play_registration_snippet }}
          SOURCE_DATE_EPOCH: "315532800"
        run: |
          work="$RUNNER_TEMP/hermes-play-verification"
          rm -rf "$work" dist/play-verification
          mkdir -p "$work/app/src/main/assets" dist/play-verification
          printf '%s\n' "$PLAY_REGISTRATION_SNIPPET" > "$work/app/src/main/assets/adi-registration.properties"

          cat > "$work/settings.gradle.kts" <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "HermesPlayVerification"
          include(":app")
          EOF

          cat > "$work/build.gradle.kts" <<'EOF'
          plugins {
              id("com.android.application") version "8.9.3" apply false
          }
          EOF

          cat > "$work/app/build.gradle.kts" <<'EOF'
          plugins {
              id("com.android.application")
          }

          android {
              namespace = "com.mobilefork.hermesagent"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.mobilefork.hermesagent"
                  minSdk = 26
                  targetSdk = 35
                  versionCode = 1
                  versionName = "play-verification"
              }

              signingConfigs {
                  create("release") {
                      storeFile = file(System.getenv("RUNNER_TEMP") + "/release.keystore")
                      storePassword = System.getenv("ANDROID_KEYSTORE_PASSWORD")
                      keyAlias = System.getenv("ANDROID_KEY_ALIAS")
                      keyPassword = System.getenv("ANDROID_KEY_PASSWORD")
                  }
              }

              buildTypes {
                  release {
                      signingConfig = signingConfigs.getByName("release")
                  }
              }
          }
          EOF

          cat > "$work/app/src/main/AndroidManifest.xml" <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application android:label="Hermes Agent Fork" />
          </manifest>
          EOF

          android/gradlew -p "$work" :app:assembleRelease --no-daemon
          cp "$work/app/build/outputs/apk/release/app-release.apk" dist/play-verification/hermes-agent-play-verification.apk

      - name: Verify signed Play verification APK
        env:
          PLAY_REGISTRATION_SNIPPET: ${{ inputs.play_registration_snippet }}
        run: |
          apk="dist/play-verification/hermes-agent-play-verification.apk"
          test -n "$apk"
          test "$(stat -c%s "$apk")" -le 167772160
          unzip -p "$apk" assets/adi-registration.properties | grep -Fx "$PLAY_REGISTRATION_SNIPPET"
          apksigner="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          test -x "$apksigner"
          "$apksigner" verify --print-certs "$apk"

      - name: Upload signed Play verification APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hermes-agent-play-verification-apk
          path: dist/play-verification/hermes-agent-play-verification.apk
          if-no-files-found: error
