name: Android

on:
  push:
    branches:
      - feat/termux-install-path
      - codex/termux-five-goals
      - 'codex/android-v*'
      - 'codex/android-chaquopy-*'
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ${{ fromJSON(vars.HERMES_ANDROID_RUNNER || '["ubuntu-latest"]') }}
    timeout-minutes: 75

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java 21
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'
          problem-matcher: true

      - name: Set up Python 3.13 for Chaquopy
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          # Skip emulator meta-package; debug assemble/unit tests only need
          # platform-tools, platforms, build-tools, and the locked native toolchain.
          packages: platform-tools platforms;android-37.0 build-tools;36.0.0 ndk;29.0.14206865 ndk;27.3.13750724 cmake;3.31.6

      - name: Build the genuine Android Python SDK stack from source
        uses: ./.github/actions/prepare-android-python

      - name: Install Python test dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e '.[android,dev]' -c constraints-android.txt

      - name: Run Android-related Python tests
        run: |
          bash scripts/run_tests.sh \
            tests/hermes_android \
            tests/gateway/test_api_server_toolset.py \
            tests/gateway/test_api_server_android_toolset.py \
            tests/tools/test_skills_sync.py \
            tests/tools/test_web_tools_firecrawl_fallback.py \
            tests/run_agent/test_run_agent_chatgpt_web.py \
            -q

      - name: Verify latest LiteRT-LM Android SDK
        run: python scripts/check_android_litertlm_version.py

      - name: Set up Node 24 for private reporting service tests
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Test private report delivery, deletion, retention and quotas
        working-directory: android/report-service
        run: node --test worker.test.mjs

      - name: Verify confined ZIP extraction
        run: |
          npm ci --prefix vendor/extract-zip --ignore-scripts --no-audit --no-fund
          node --test vendor/extract-zip/test.cjs

      - name: Ensure Gradle wrapper is executable
        run: chmod +x android/gradlew

      - name: Verify benchmark runtime guard against the application pin
        shell: bash
        run: |
          set -euo pipefail
          export HERMES_RELEASE_TAG="v$(sed -n 's/^versionName=//p' fdroid/com.mobilefork.hermesagent.version)"
          export HERMES_SOURCE_DIGEST="$(python scripts/android_release_evidence.py source-identity --require-clean | sed -n 's/^sourceDigest=//p')"
          coordinate="com.google.ai.edge.litertlm:litertlm-android:$(python scripts/check_android_litertlm_version.py --print-declared)"
          cd android
          ./gradlew :app:assembleBenchmark :macrobenchmark:assembleBenchmark --dry-run --no-daemon \
            "-PhermesBenchmarkExpectedLiteRtLmCoordinate=$coordinate"
          if ./gradlew :app:assembleBenchmark --dry-run --no-daemon \
            -PhermesBenchmarkExpectedLiteRtLmCoordinate=com.google.ai.edge.litertlm:litertlm-android:0.0.0 \
            > "$RUNNER_TEMP/benchmark-stale-coordinate.log" 2>&1; then
            echo 'Benchmark guard accepted a different runtime coordinate' >&2
            exit 1
          fi
          grep -F 'hermesBenchmarkExpectedLiteRtLmCoordinate must equal the release coordinate' \
            "$RUNNER_TEMP/benchmark-stale-coordinate.log"

      - name: Build Android debug APK and run unit tests
        working-directory: android
        env:
          SOURCE_DATE_EPOCH: "315532800"
        run: |
          rm -rf ../build
          export PYTHON_FOR_BUILD="$(command -v python3.13 || command -v python3 || command -v python)"
          ./gradlew :app:testDebugUnitTest -PskipHermesAndroidLinuxAssets=true
          ./gradlew :app:compileDebugAndroidTestKotlin -PskipHermesAndroidLinuxAssets=true
          ./gradlew :app:compileBenchmarkKotlin :macrobenchmark:compileBenchmarkKotlin \
            -PskipHermesAndroidLinuxAssets=true
          ./gradlew :app:assembleDebug

      - name: Verify generated runtimes inside the APK
        run: |
          python scripts/verify_android_runtime_package.py android/app/build/outputs/apk/debug/app-debug.apk \
            --python-bundle "${GRADLE_USER_HOME:-$HOME/.gradle}/hermes-python-runtime"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hermes-agent-android-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
