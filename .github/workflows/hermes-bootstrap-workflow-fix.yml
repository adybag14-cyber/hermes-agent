name: Fix Hermes v0.13.39 Bootstrap Workflow

on:
  push:
    branches:
      - codex/v0.13.39-bootstrap
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hermes-v0.13.39-bootstrap-fix
  cancel-in-progress: false

jobs:
  fix:
    if: github.repository == 'adybag14-cyber/hermes-agent'
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout bootstrap branch
        uses: actions/checkout@v5
        with:
          ref: codex/v0.13.39-bootstrap
          token: ${{ github.token }}

      - name: Patch base64 decoder
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/hermes-v0.13.39-bootstrap.yml')
          s = p.read_text(encoding='utf-8')
          old = "base64 -d /tmp/hermes-v0.13.39.patch.gz.b64 | gzip -d > /tmp/hermes-v0.13.39.patch"
          new = "tr -d '[:space:]' < /tmp/hermes-v0.13.39.patch.gz.b64 | base64 -d | gzip -d > /tmp/hermes-v0.13.39.patch"
          if old in s:
              p.write_text(s.replace(old, new), encoding='utf-8')
          elif new not in s:
              raise SystemExit('expected decoder line not found')
          PY
          if git diff --quiet; then
            echo "Bootstrap workflow already patched."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/hermes-v0.13.39-bootstrap.yml
          git commit -m "Fix Hermes v0.13.39 bootstrap decoder"
          git push origin HEAD:codex/v0.13.39-bootstrap
