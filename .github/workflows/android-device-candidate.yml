name: Android Signed Device Candidate

on:
  repository_dispatch:
    types: [android-device-candidate]

concurrency:
  group: android-device-candidate-${{ github.event.client_payload.candidate_sha }}
  cancel-in-progress: true

jobs:
  build-signed-candidate:
    runs-on: ubuntu-22.04
    timeout-minutes: 75
    permissions:
      contents: read

    steps:
      - name: Authorize immutable default-branch candidate
        id: authority
        env:
          REQUESTED_CANDIDATE_SHA: ${{ github.event.client_payload.candidate_sha }}
          HERMES_RELEASE_TAG: ${{ github.event.client_payload.release_tag }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = "repository_dispatch"
          test "$GITHUB_REF" = "refs/heads/${DEFAULT_BRANCH}"
          printf '%s' "$REQUESTED_CANDIDATE_SHA" | grep -Eq '^[0-9a-f]{40}$'
          printf '%s' "$HERMES_RELEASE_TAG" | \
            grep -Eq '^v0\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(alpha|beta|rc)(\.[0-9]+)?)?$'
          test "$GITHUB_SHA" = "$REQUESTED_CANDIDATE_SHA"
          printf 'candidate_sha=%s\nrelease_tag=%s\n' \
            "$REQUESTED_CANDIDATE_SHA" "$HERMES_RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Checkout candidate source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ steps.authority.outputs.candidate_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Require candidate to remain the live default-branch head
        env:
          REQUESTED_CANDIDATE_SHA: ${{ steps.authority.outputs.candidate_sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          test -n "$DEFAULT_BRANCH"
          git check-ref-format --branch "$DEFAULT_BRANCH"
          git fetch --no-tags --depth=1 origin \
            "+refs/heads/${DEFAULT_BRANCH}:refs/remotes/origin/${DEFAULT_BRANCH}"
          checked_out_sha="$(git rev-parse --verify 'HEAD^{commit}')"
          live_default_sha="$(git rev-parse --verify "refs/remotes/origin/${DEFAULT_BRANCH}^{commit}")"
          printf 'requestedCandidate=%s\nworkflowSha=%s\ncheckedOutSha=%s\nliveDefaultSha=%s\n' \
            "$REQUESTED_CANDIDATE_SHA" "$GITHUB_SHA" "$checked_out_sha" "$live_default_sha"
          test "$GITHUB_SHA" = "$REQUESTED_CANDIDATE_SHA"
          test "$checked_out_sha" = "$REQUESTED_CANDIDATE_SHA"
          test "$live_default_sha" = "$REQUESTED_CANDIDATE_SHA"

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Python 3.13 for Chaquopy
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0 ndk;29.0.14206865 cmake;3.31.6

      - name: Verify candidate identity
        id: identity
        env:
          HERMES_RELEASE_TAG: ${{ steps.authority.outputs.release_tag }}
        run: |
          identity="$(python scripts/check_android_release_identity.py --tag "$HERMES_RELEASE_TAG")"
          printf '%s\n' "$identity"
          version_name="$(printf '%s\n' "$identity" | sed -n 's/^versionName=//p')"
          version_code="$(printf '%s\n' "$identity" | sed -n 's/^versionCode=//p')"
          source_identity="$(python scripts/android_release_evidence.py source-identity \
            --repo-root . \
            --require-clean)"
          printf '%s\n' "$source_identity"
          source_digest="$(printf '%s\n' "$source_identity" | sed -n 's/^sourceDigest=//p')"
          printf '%s' "$source_digest" | grep -Eq '^[0-9a-f]{64}$'
          printf 'version_name=%s\nversion_code=%s\nsource_digest=%s\n' \
            "$version_name" "$version_code" "$source_digest" >> "$GITHUB_OUTPUT"

      - name: Build unsigned source-bound candidate APK
        working-directory: android
        env:
          HERMES_RELEASE_TAG: ${{ steps.authority.outputs.release_tag }}
          HERMES_SOURCE_DIGEST: ${{ steps.identity.outputs.source_digest }}
          SOURCE_DATE_EPOCH: '315532800'
        run: |
          set -euo pipefail
          rm -rf ../build ../dist/device-candidate
          rm -f release.keystore keystore.properties
          export PYTHON_FOR_BUILD="$(command -v python3.13 || command -v python3 || command -v python)"
          ./gradlew :app:assembleRelease --no-daemon
          unsigned_apk="app/build/outputs/apk/release/app-release-unsigned.apk"
          test -f "$unsigned_apk"
          python ../scripts/verify_android_source_bound_artifact.py \
            --artifact "$unsigned_apk" \
            --source-digest "$HERMES_SOURCE_DIGEST"

      - name: Reauthorize live default head before restoring signing secrets
        env:
          REQUESTED_CANDIDATE_SHA: ${{ steps.authority.outputs.candidate_sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          test -n "$DEFAULT_BRANCH"
          git check-ref-format --branch "$DEFAULT_BRANCH"
          git fetch --no-tags --depth=1 origin \
            "+refs/heads/${DEFAULT_BRANCH}:refs/remotes/origin/${DEFAULT_BRANCH}"
          checked_out_sha="$(git rev-parse --verify 'HEAD^{commit}')"
          live_default_sha="$(git rev-parse --verify "refs/remotes/origin/${DEFAULT_BRANCH}^{commit}")"
          test "$GITHUB_SHA" = "$REQUESTED_CANDIDATE_SHA"
          test "$checked_out_sha" = "$REQUESTED_CANDIDATE_SHA"
          test "$live_default_sha" = "$REQUESTED_CANDIDATE_SHA"

      - name: Restore, sign, and verify source-bound candidate APK
        working-directory: android
        env:
          HERMES_RELEASE_TAG: ${{ steps.authority.outputs.release_tag }}
          HERMES_SOURCE_DIGEST: ${{ steps.identity.outputs.source_digest }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          EXPECTED_VERSION_NAME: ${{ steps.identity.outputs.version_name }}
          EXPECTED_VERSION_CODE: ${{ steps.identity.outputs.version_code }}
          EXPECTED_SIGNER_SHA256: 2cbdb94d6081413055af1e903d4c1d6714300b4240402d1d4c8182fda777d14e
        run: |
          set -euo pipefail
          cleanup_signing_material() {
            rm -f release.keystore keystore.properties
          }
          trap cleanup_signing_material EXIT
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > release.keystore
          sdk_root="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          build_tools_dir="$sdk_root/build-tools/35.0.0"
          apksigner="$build_tools_dir/apksigner"
          aapt2="$build_tools_dir/aapt2"
          unsigned_apk="app/build/outputs/apk/release/app-release-unsigned.apk"
          signed_apk="app/build/outputs/apk/release/app-release.apk"
          test -x "$apksigner"
          test -x "$aapt2"
          test -f "$unsigned_apk"
          rm -f "$signed_apk"
          "$apksigner" sign \
            --alignment-preserved true \
            --v1-signing-enabled false \
            --v2-signing-enabled true \
            --v3-signing-enabled false \
            --v4-signing-enabled false \
            --ks release.keystore \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
            --key-pass env:ANDROID_KEY_PASSWORD \
            --out "$signed_apk" \
            "$unsigned_apk"
          "$apksigner" verify --verbose "$signed_apk"
          cert_digest="$("$apksigner" verify --print-certs "$signed_apk" | \
            sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | tr '[:upper:]' '[:lower:]')"
          test "$cert_digest" = "$EXPECTED_SIGNER_SHA256"
          badging="$("$aapt2" dump badging "$signed_apk" | head -n 1)"
          printf '%s\n' "$badging"
          printf '%s\n' "$badging" | grep -F "package: name='com.mobilefork.hermesagent'"
          printf '%s\n' "$badging" | grep -F "versionCode='$EXPECTED_VERSION_CODE'"
          printf '%s\n' "$badging" | grep -F "versionName='$EXPECTED_VERSION_NAME'"
          python ../scripts/verify_android_source_bound_artifact.py \
            --artifact "$signed_apk" \
            --source-digest "$HERMES_SOURCE_DIGEST"
          mkdir -p ../dist/device-candidate
          output="../dist/device-candidate/hermes-agent-android-${HERMES_RELEASE_TAG}-device-candidate.apk"
          cp -f "$signed_apk" "$output"
          (cd ../dist/device-candidate && sha256sum "$(basename "$output")" > "$(basename "$output").sha256")

      - name: Remove signing material
        if: ${{ always() }}
        run: rm -f android/release.keystore android/keystore.properties

      - name: Require candidate to remain live default head before upload
        env:
          REQUESTED_CANDIDATE_SHA: ${{ steps.authority.outputs.candidate_sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          test -n "$DEFAULT_BRANCH"
          git check-ref-format --branch "$DEFAULT_BRANCH"
          git fetch --no-tags --depth=1 origin \
            "+refs/heads/${DEFAULT_BRANCH}:refs/remotes/origin/${DEFAULT_BRANCH}"
          checked_out_sha="$(git rev-parse --verify 'HEAD^{commit}')"
          live_default_sha="$(git rev-parse --verify "refs/remotes/origin/${DEFAULT_BRANCH}^{commit}")"
          test "$GITHUB_SHA" = "$REQUESTED_CANDIDATE_SHA"
          test "$checked_out_sha" = "$REQUESTED_CANDIDATE_SHA"
          test "$live_default_sha" = "$REQUESTED_CANDIDATE_SHA"

      - name: Upload signed device candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hermes-agent-android-signed-device-candidate
          path: dist/device-candidate/*
          if-no-files-found: error
          retention-days: 3
